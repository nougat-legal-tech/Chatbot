version: 1.3.11
cache: true

interface:
  agents:
    use: true
    create: true
    share: false
    public: false
  mcpServers:
    use: true
    create: true
    share: false
    public: false

endpoints:
  agents:
    # Use model-written progress from the agent's existing provider. Bound
    # the additional label work for long runs.
    activityLabel: true
    activityMaxPerRun: 6

mcpSettings:
  allowedAddresses:
    - "127.0.0.1:8001"

mcpServers:
  juristai-django:
    type: streamable-http
    url: http://127.0.0.1:8001/mcp
    # The sidecar rejects every request without this shared secret (403
    # "forbidden"). Without the header LibreChat loaded no MCP tools, so the
    # agent narrated actions it never ran (live 2026-10-03: "Rivera ... is now
    # being added to your cases" with no add_case call and no case created).
    headers:
      x-mcp-secret: "${MCP_SERVER_SECRET}"
    # Auth is the shared-secret header, never OAuth. Without this, startup
    # probes the URL with no headers, gets the secret gate's 403, marks the
    # server OAuth-required and loads 0 tools (live 2026-10-07, task def 177).
    requiresOAuth: false
    timeout: 60000
